<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="RamShared — Memory Tier Cascade Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#090f1d"/>
    </linearGradient>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2344"/>
      <stop offset="100%" stop-color="#07152b"/>
    </linearGradient>
    <linearGradient id="zramTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="vramTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="diskTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Top Title & Badge -->
  <rect x="60" y="38" width="340" height="30" rx="15" fill="#0284c7" fill-opacity="0.2" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="76" y="58" fill="#00e5ff" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="800" letter-spacing="0.5">3-TIER MEMORY CASCADE ARCHITECTURE</text>
  
  <text x="60" y="108" fill="#ffffff" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="36" font-weight="800">RamShared — Eliminating Memory Pressure Freezes</text>
  <text x="60" y="138" fill="#94a3b8" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="16.5">Leverages idle GPU VRAM as a fast PCIe cache and seamlessly yields when Windows or games need it back</text>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M395 295 L420 295" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="5 4"/>
  <polygon points="420,290 428,295 420,300" fill="#00e5ff"/>
  
  <!-- Flow Connector 2 -> 3 -->
  <path d="M780 295 L805 295" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5 4"/>
  <polygon points="805,290 813,295 805,300" fill="#3b82f6"/>

  <!-- Tier 0: ZRAM Card (x=60, w=330) -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="168" width="330" height="264" rx="18" fill="url(#cardBg)" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.8"/>
    <rect x="60" y="168" width="330" height="6" rx="3" fill="url(#zramTop)"/>
    
    <!-- Solid High-Contrast Badge -->
    <rect x="80" y="192" width="180" height="30" rx="15" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="96" y="212" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">TIER 0 · PRIORITY 100</text>
    
    <text x="80" y="258" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="24" font-weight="800">Compressed RAM</text>
    <text x="80" y="284" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="14.5" font-weight="700">ZRAM (CPU Tier)</text>
    
    <text x="80" y="324" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="15.5">In-memory compressed block</text>
    <text x="80" y="348" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="15.5">storage in system RAM.</text>
    
    <text x="80" y="398" fill="#fcd34d" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Sub-microsecond latency</text>
  </g>

  <!-- Tier 1: RamShared VRAM Card (x=430, w=345) -->
  <g filter="url(#cardShadow)">
    <rect x="430" y="168" width="345" height="264" rx="18" fill="url(#heroBg)" stroke="#00e5ff" stroke-width="2.5"/>
    <rect x="430" y="168" width="345" height="6" rx="3" fill="url(#vramTop)"/>
    
    <!-- Solid High-Contrast Badge -->
    <rect x="450" y="192" width="180" height="30" rx="15" fill="#0284c7" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="466" y="212" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">TIER 1 · PRIORITY 50</text>
    
    <text x="450" y="258" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="800">GPU Video RAM (VRAM)</text>
    <text x="450" y="284" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="14.5" font-weight="700">RamShared (PCIe Gen 3 x16)</text>
    
    <text x="450" y="324" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="15.5">High-speed PCIe VRAM cache</text>
    <text x="450" y="348" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="15.5">+ Durable 24 GB SSD origin.</text>
    
    <text x="450" y="396" fill="#4ade80" font-family="'Inter', sans-serif" font-size="16" font-weight="800">6.07 GiB/s (6,211.2 MiB/s)</text>
    <text x="450" y="416" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="600">Ultra-low latency of ~8–241 µs</text>
  </g>

  <!-- Tier 2: SSD Swap Card (x=815, w=325) -->
  <g filter="url(#cardShadow)">
    <rect x="815" y="168" width="325" height="264" rx="18" fill="url(#cardBg)" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.8"/>
    <rect x="815" y="168" width="325" height="6" rx="3" fill="url(#diskTop)"/>
    
    <!-- Solid High-Contrast Badge -->
    <rect x="835" y="192" width="180" height="30" rx="15" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="851" y="212" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">TIER 2 · PRIORITY -2</text>
    
    <text x="835" y="258" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="24" font-weight="800">Disk Swap Storage</text>
    <text x="835" y="284" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14.5" font-weight="700">Stock SSD / VHDX</text>
    
    <text x="835" y="324" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="15.5">Authoritative fallback ensuring</text>
    <text x="835" y="348" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="15.5">bounded physical capacity.</text>
    
    <text x="835" y="398" fill="#f87171" font-family="'Inter', sans-serif" font-size="15" font-weight="700">~63–85 MB/s on disk</text>
  </g>

  <!-- Bottom Banner: Zero Loss & Safety Invariant -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="455" width="1080" height="135" rx="18" fill="#0c1626" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Verified Badge Icon -->
    <circle cx="105" cy="522" r="24" fill="#166534" stroke="#22c55e" stroke-width="2.5"/>
    <polyline points="95,522 102,529 116,514" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="148" y="502" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="19" font-weight="800">Instant Revocation &amp; Data Integrity Invariant</text>
    <text x="148" y="532" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="15">If Windows or games reclaim GPU memory, VRAM is instantly yielded and reads fall back directly to SSD origin.</text>
    <text x="148" y="558" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">Zero Out-Of-Memory kills (0 OOM) · 100% verified byte-by-byte SHA-256 data integrity.</text>
  </g>

  <!-- Footer Info -->
  <text x="60" y="635" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="13">github.com/emersonbusson/ramshared · Verified and qualified on physical hardware (EVD-0037, EVD-0038)</text>
</svg>
