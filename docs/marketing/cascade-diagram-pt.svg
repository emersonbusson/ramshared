<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="RamShared — Cascata de Memória e Aceleração">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#071526"/>
    </linearGradient>
    <linearGradient id="zramTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="vramTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="diskTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Top Title & Badge -->
  <rect x="60" y="44" width="310" height="28" rx="14" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="75" y="63" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800">ARQUITETURA DE MEMÓRIA EM 3 NÍVEIS</text>
  
  <text x="60" y="112" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">RamShared — Como o Sistema Elimina Travamentos</text>
  <text x="60" y="142" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16">Usa a memória ociosa da GPU como cache rápido e devolve instantaneamente se um jogo ou o Windows precisar</text>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M395 295 L420 295" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 4"/>
  <polygon points="420,290 428,295 420,300" fill="#38bdf8"/>
  
  <!-- Flow Connector 2 -> 3 -->
  <path d="M780 295 L805 295" stroke="#64748b" stroke-width="2.5" stroke-dasharray="5 4"/>
  <polygon points="805,290 813,295 805,300" fill="#64748b"/>

  <!-- Tier 1: ZRAM Card (x=60, w=330) -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="172" width="330" height="255" rx="18" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="60" y="172" width="330" height="6" rx="3" fill="url(#zramTop)"/>
    
    <!-- Solid High-Contrast Badge -->
    <rect x="80" y="195" width="200" height="28" rx="14" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="96" y="214" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">1º NÍVEL · PRIORIDADE 100</text>
    
    <text x="80" y="260" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="23" font-weight="700">RAM Comprimida</text>
    <text x="80" y="286" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="14" font-weight="700">ZRAM (Processador)</text>
    
    <text x="80" y="325" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Comprime blocos rápidos direto</text>
    <text x="80" y="347" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">na memória RAM do sistema.</text>
    
    <text x="80" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Latência em microssegundos</text>
  </g>

  <!-- Tier 2: RamShared VRAM Card (x=430, w=345) -->
  <g filter="url(#cardShadow)">
    <rect x="430" y="172" width="345" height="255" rx="18" fill="url(#heroBg)" stroke="#0284c7" stroke-width="2.5"/>
    <rect x="430" y="172" width="345" height="6" rx="3" fill="url(#vramTop)"/>
    
    <!-- Solid High-Contrast Badge -->
    <rect x="450" y="195" width="190" height="28" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="466" y="214" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">2º NÍVEL · PRIORIDADE 50</text>
    
    <text x="450" y="260" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="23" font-weight="800">VRAM da Placa de Vídeo</text>
    <text x="450" y="286" fill="#00f2fe" font-family="ui-monospace, monospace" font-size="14" font-weight="700">RamShared (PCIe Gen 3 x16)</text>
    
    <text x="450" y="325" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">Cache veloz em VRAM ociosa</text>
    <text x="450" y="347" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">+ Origem segura no SSD (24 GB).</text>
    
    <text x="450" y="385" fill="#4ade80" font-family="system-ui, sans-serif" font-size="15" font-weight="800">6,07 GiB/s (6.211,2 MiB/s)</text>
    <text x="450" y="407" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12">Latência ultra-rápida de ~8–241 µs</text>
  </g>

  <!-- Tier 3: SSD Swap Card (x=815, w=325) -->
  <g filter="url(#cardShadow)">
    <rect x="815" y="172" width="325" height="255" rx="18" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="815" y="172" width="325" height="6" rx="3" fill="url(#diskTop)"/>
    
    <!-- Solid High-Contrast Badge -->
    <rect x="835" y="195" width="180" height="28" rx="14" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <text x="851" y="214" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">3º NÍVEL · PRIORIDADE -2</text>
    
    <text x="835" y="260" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="23" font-weight="700">Swap em Disco</text>
    <text x="835" y="286" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="14" font-weight="700">SSD / VHDX Padrão</text>
    
    <text x="835" y="325" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Última linha de defesa para</text>
    <text x="835" y="347" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">evitar falta total de espaço.</text>
    
    <text x="835" y="395" fill="#f87171" font-family="system-ui, sans-serif" font-size="13.5">~63–85 MB/s em disco</text>
  </g>

  <!-- Bottom Banner: Zero Loss & Safety Invariant -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="455" width="1080" height="135" rx="18" fill="#0c1626" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Verified Badge Icon -->
    <circle cx="105" cy="522" r="24" fill="#166534" stroke="#22c55e" stroke-width="2.5"/>
    <polyline points="95,522 102,529 116,514" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="148" y="502" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Garantia de Devolução Instantânea (Zero Corrupção)</text>
    <text x="148" y="532" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14.5">Se o Windows ou um jogo exigir a placa de vídeo de volta, a memória é liberada na hora e a leitura cai direto no SSD.</text>
    <text x="148" y="558" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13.5">Zero programas fechados (0 OOM Kills) · 100% dos dados verificados byte a byte com integridade SHA-256.</text>
  </g>

  <!-- Footer Info -->
  <text x="60" y="635" fill="#64748b" font-family="ui-monospace, monospace" font-size="13">github.com/emersonbusson/ramshared · Testado e qualificado em hardware real (EVD-0037, EVD-0038)</text>
</svg>
