name: Release Packaging & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.11.0)'
        required: false
        default: 'v0.11.0'

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Distro Packages (Ubuntu, Fedora, Arch)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rpm dpkg-dev binutils build-essential

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action pinned
        with:
          toolchain: 1.98.0

      - name: Build Release Binaries
        run: cargo build --release --locked

      - name: Build Debian/Ubuntu Package (.deb)
        run: ./scripts/package/build-deb-package.sh "${{ github.ref_name || inputs.version }}"

      - name: Build Fedora/RHEL Package (.rpm)
        run: ./scripts/package/build-rpm-package.sh "${{ github.ref_name || inputs.version }}"

      - name: Package Arch Linux AUR Tarball
        run: |
          mkdir -p artifacts/packages/arch
          tar -czf artifacts/packages/ramshared-arch.tar.gz \
            packaging/arch/PKGBUILD \
            packaging/arch/ramshared.install \
            packaging/systemd/60-ramshared.rules \
            packaging/systemd/ramshared-vram.service

      - name: Generate Checksums
        working-directory: artifacts/packages
        run: |
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-packages
          path: artifacts/packages/

      - name: Attach Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts/packages -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" -o -name "SHA256SUMS.txt" \) -exec gh release upload "${{ github.ref_name }}" {} + --clobber || true
