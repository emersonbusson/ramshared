name: PR Body Check

on:
  workflow_call:

permissions: {}

concurrency:
  group: pr-body-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: pr-body
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR description and title
        if: github.event.pull_request.user.login != 'dependabot[bot]' && !endsWith(github.event.pull_request.user.login, '[bot]')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = context.payload.pull_request?.title ?? '';
            const ccPattern = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9\-]+\))?:\s.+$/;
            if (title.length > 72) {
              core.setFailed(`PR title is too long (${title.length} chars). Maximum allowed is 72 characters.`);
            } else if (!ccPattern.test(title)) {
              core.setFailed(`PR title does not follow Conventional Commits format.`);
            } else {
              core.info('PR title follows Conventional Commits format and length limits.');
            }

            const body = context.payload.pull_request?.body ?? '';
            const requiredSections = [
              { name: 'Resumo', pattern: /^##\s+Resumo\s*$/im },
              { name: 'Commits', pattern: /^##\s+Commits\s*$/im },
              { name: 'Issue', pattern: /^##\s+Issue\s*$/im },
              { name: 'Responsavel', pattern: /^##\s+Responsavel\s*$/im },
              { name: 'Labels', pattern: /^##\s+Labels\s*$/im },
              { name: 'Validacao', pattern: /^##\s+Validacao\s*$/im },
              { name: 'Rollback trigger', pattern: /^##\s+Rollback trigger\s*$/im }
            ];

            const missing = requiredSections
              .filter(section => !section.pattern.test(body))
              .map(section => section.name);

            if (missing.length > 0) {
              core.setFailed(`PR description is missing required sections: ${missing.join(', ')}. Please check .github/pull_request_template.md.`);
            } else {
              core.info('All required PR description sections are present.');
            }

  pr-body-summary:
    name: pr-body-summary
    if: always()
    needs: [pr-body]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require completed PR body gate
        env:
          PR_BODY_RESULT: ${{ needs.pr-body.result }}
        run: |
          set -euo pipefail
          if [ "$PR_BODY_RESULT" != success ]; then
            echo "PR_BODY_SUMMARY=FAIL"
            exit 1
          fi
          echo "PR_BODY_SUMMARY=PASS"
