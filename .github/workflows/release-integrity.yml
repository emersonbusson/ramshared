name: Release Integrity

on:
  push:
    tags:
      - 'v0.9.0-beta.1'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact beta tag to recover
        required: true
        type: string
      source_sha:
        description: Exact 40-character tag source SHA
        required: true
        type: string

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release Integrity recovery {0} @ {1}', inputs.tag, inputs.source_sha) || format('Release Integrity {0} @ {1}', github.ref_name, github.sha) }}

permissions: {}

concurrency:
  group: release-integrity-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-integrity:
    name: release-integrity
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_TARGET_TAG: v0.9.0-beta.1
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_EVENT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
      RAMSHARED_PACKAGE_OUT: artifacts/release
      RAMSHARED_PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout trusted recovery tooling
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tmp/recovery-policy
          fetch-depth: 1

      - name: Preserve trusted recovery tooling
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-policy"
          cp -- tmp/recovery-policy/tools/ci/merge-release-sboms.mjs "$RUNNER_TEMP/release-policy/merge-release-sboms.mjs"

      - name: Checkout tag source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.17.0

      - name: Verify clean target tag source
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
          test "$RELEASE_TAG" = "$RELEASE_TARGET_TAG"
          case "$RELEASE_EVENT_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) exit 1 ;;
          esac
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_revision="$(git rev-list -n 1 "$RELEASE_TAG")"
          event_revision="$(git rev-parse "${RELEASE_EVENT_SHA}^{commit}")"
          test "$event_revision" = "$tag_revision"
          printf 'revision=%s\n' "$tag_revision" >> "$GITHUB_OUTPUT"
          printf 'RELEASE_REVISION=%s\n' "$tag_revision" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct "$tag_revision")" >> "$GITHUB_ENV"

      - name: Build Linux bundle
        shell: bash
        run: scripts/package/build-linux-bundle.sh

      - name: Generate pinned CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked --version 0.5.9
          cargo cyclonedx --manifest-path Cargo.toml --format json --spec-version 1.5 --override-filename ramshared-sbom.cdx
          merger=tools/ci/merge-release-sboms.mjs
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            merger="$RUNNER_TEMP/release-policy/merge-release-sboms.mjs"
          fi
          node "$merger" \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --input crates/ramshared-cli/ramshared-sbom.cdx.json \
            --input crates/ramshared-wsl2d/ramshared-sbom.cdx.json \
            --out artifacts/release/ramshared-sbom.cdx.json

      - name: Write and verify detached archive checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="ramshared-linux-$RELEASE_TAG.tar.gz"
          cd artifacts/release
          sha256sum "$archive" > "$archive.sha256"
          sha256sum --check "$archive.sha256"

      - name: Write release manifest
        shell: bash
        run: |
          set -euo pipefail
          prior_release="$(git tag --merged "$RELEASE_REVISION" --list 'v*' --sort=-version:refname | awk -v current="$RELEASE_TAG" '$0 != current { print; exit }')"
          if [ -z "$prior_release" ]; then prior_release=none; fi
          rust_version="$(rustc --version | awk '{print $2}')"
          node tools/ci/write-release-manifest.mjs \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --rust-version "$rust_version" \
            --bundle "artifacts/release/ramshared-linux-$RELEASE_TAG.tar.gz" \
            --checksum "artifacts/release/ramshared-linux-$RELEASE_TAG.tar.gz.sha256" \
            --sbom artifacts/release/ramshared-sbom.cdx.json \
            --prior-release "$prior_release" \
            --rollback-trigger "bundle checksum mismatch" \
            --out artifacts/release/release-manifest.json \
            --clean-tree

      - name: Validate release manifest
        shell: bash
        run: node tools/ci/check-release-integrity.mjs --check artifacts/release/release-manifest.json --root . --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION"

      - name: Stage exact integrity candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir=tmp/release-integrity-candidate
          mkdir -p "$candidate_dir/artifacts/release"
          for asset in \
            "ramshared-linux-$RELEASE_TAG.tar.gz" \
            "ramshared-linux-$RELEASE_TAG.tar.gz.sha256" \
            ramshared-sbom.cdx.json \
            release-manifest.json; do
            cp -- "artifacts/release/$asset" "$candidate_dir/artifacts/release/$asset"
          done
          expected="$(printf '%s\n' \
            "artifacts/release/ramshared-linux-$RELEASE_TAG.tar.gz" \
            "artifacts/release/ramshared-linux-$RELEASE_TAG.tar.gz.sha256" \
            'artifacts/release/ramshared-sbom.cdx.json' \
            'artifacts/release/release-manifest.json')"
          actual="$(find "$candidate_dir" -type f -printf '%P\n' | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Upload exact integrity candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-integrity-${{ env.RELEASE_TAG }}-${{ steps.identity.outputs.revision }}
          path: tmp/release-integrity-candidate
          if-no-files-found: error
          retention-days: 14
