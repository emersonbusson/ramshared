name: Cancel Closed Pull Request Runs

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: cancel-closed-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cancel-closed-pr:
    name: closed-pr-cancellation
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref != 'main' && !startsWith(github.event.pull_request.base.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Cancel queued and running checks for the closed pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.pull_request?.head?.sha;
            if (!headSha) {
              core.setFailed('closed pull request has no head SHA');
              return;
            }
            const runIds = new Set();
            for (const status of ['queued', 'in_progress']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                event: 'pull_request',
                head_sha: headSha,
                status,
                per_page: 100,
              });
              for (const run of runs) runIds.add(run.id);
            }
            runIds.delete(context.runId);
            let cancelled = 0;
            for (const runId of runIds) {
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: runId });
                cancelled += 1;
              } catch (error) {
                if (error.status !== 409 && error.status !== 422) throw error;
              }
            }
            core.info(`closed-pr-cancellation=${cancelled}`);
