name: Comment Language Gate

on:
  workflow_call:

permissions: {}

concurrency:
  group: comment-language-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comment-language:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Check added repository text uses canonical English
        run: >-
          node tools/ci/check-comment-language.mjs
          --diff "origin/${{ github.base_ref }}"


  comment-language-summary:
    name: comment-language-summary
    if: always()
    needs: [comment-language]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require completed comment language gate
        env:
          COMMENT_LANGUAGE_RESULT: ${{ needs.comment-language.result }}
        run: |
          set -euo pipefail
          if [ "$COMMENT_LANGUAGE_RESULT" != success ]; then
            echo "COMMENT_LANGUAGE_SUMMARY=FAIL"
            exit 1
          fi
          echo "COMMENT_LANGUAGE_SUMMARY=PASS"
