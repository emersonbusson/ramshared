name: Validation Schema Gate

on:
  workflow_call:

permissions: {}

concurrency:
  group: validation-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate new entries in validation.md
        run: node tools/ci/check-validation-schema.mjs --diff "origin/${{ github.base_ref }}"

      - name: Install Python dependencies for configuration schema validation
        run: python3 -m pip install jsonschema==4.23.0 tomli==2.0.1 --user

      - name: Validate ramshared configuration TOML/JSON files
        run: python3 tools/ci/check-config-schemas.py --check

  validation-schema-summary:
    name: validation-schema-summary
    if: always()
    needs: [validation-schema]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require completed validation schema gate
        env:
          VALIDATION_SCHEMA_RESULT: ${{ needs.validation-schema.result }}
        run: |
          set -euo pipefail
          if [ "$VALIDATION_SCHEMA_RESULT" != success ]; then
            echo "VALIDATION_SCHEMA_SUMMARY=FAIL"
            exit 1
          fi
          echo "VALIDATION_SCHEMA_SUMMARY=PASS"
