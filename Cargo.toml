[workspace]
resolver = "3"
members = [
    "crates/ramshared-dxg",
    "crates/ramshared-cli",
    "crates/ramshared-tier",
    "crates/ramshared-cuda",
    "crates/ramshared-block",
    "crates/ramshared-wsl2d",
    "crates/ramshared-integrity",
    "crates/ramshared-uring",
    "crates/ramshared-broker",
    "crates/ramshared-config",
    "crates/ramshared-agent",
    "crates/ramshared-vram",
    "crates/ramshared-vulkan",
    "crates/ramshared-winsvc",
    "crates/ramshared-winbroker",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/emersonbusson/ramshared"
# Internal workspace crates are never published to crates.io. Marking them
# private prevents accidental publication and keeps path dependencies out of
# external wildcard-dependency policy.
publish = false
